<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito React Pro - Contraste Alto</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Estilos para descanso visual y orden */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #1a202c; /* Fondo oscuro para contraste real */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        #root {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #1a202c;
            font-size: 2.5rem;
            margin-bottom: 40px;
            border-bottom: 4px solid #3182ce;
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        h3 {
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
        }

        /* GRID CORREGIDO: 4 columnas exactas para evitar elementos huérfanos */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* Fuerza 4 columnas */
            gap: 20px;
            margin-bottom: 50px;
        }

        /* Si la pantalla es mediana, 2 columnas */
        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
        }
        /* Si la pantalla es chica, 1 columna */
        @media (max-width: 500px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .item-card {
            border: 1px solid #000;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #f1f5f9  ; /*#f8fafc;*/
        }

        .item-card span {
            font-weight: bold;
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 15px;
        }

        /* Botones con colores sólidos y fuertes */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn-agregar {
            background-color: #3182ce;
            color: white;
        }

        .btn-agregar:hover { background-color: #2b6cb0; }

        .btn-quitar {
            background-color: #e53e3e;
            color: white;
        }

        .btn-quitar:hover { background-color: #c53030; }

        hr {
            border: 0;
            border-top: 2px solid #edf2f7;
            margin: 40px 0;
        }

        .empty-msg {
            grid-column: span 4;
            text-align: center;
            color: #a0aec0;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Elemento({ nombre, alClick, posicion, textoBoton }) {
            const manejarClick = () => {
                if (posicion === -1) {
                    alClick(nombre);
                } else {
                    alClick(posicion);
                }
            };

            return (
                <div className="item-card">
                    <span>{nombre}</span>
                    <button 
                        className={posicion === -1 ? "btn-agregar" : "btn-quitar"} 
                        onClick={manejarClick}
                    >
                        {textoBoton}
                    </button>
                </div>
            );
        }

        function App() {
            const productosDisponibles = ["Adermicina", "Bengue", "Ibuprofeno", "Buscapina"];
            const [carrito, setCarrito] = useState([]);

            const agregarAlCarrito = (nombre) => {
                setCarrito([...carrito, nombre]);
            };

            const quitarDelCarrito = (indiceABorrar) => {
                const nuevoCarrito = carrito.filter((_, i) => i !== indiceABorrar);
                setCarrito(nuevoCarrito);
            };

            return (
                <div>
                    <h1>CARRITO DE COMPRAS</h1>
                    
                    <h3>Catálogo Disponible</h3>
                    <div className="grid-container">
                        {productosDisponibles.map((prod, i) => (
                            <Elemento 
                                key={"d-"+i} 
                                nombre={prod} 
                                posicion={-1} 
                                alClick={agregarAlCarrito} 
                                textoBoton="Agregar al carrito" 
                            />
                        ))}
                    </div>

                    <hr />

                    <h3>Tu Selección ({carrito.length})</h3>
                    <div className="grid-container">
                        {carrito.length === 0 ? 
                            <div className="empty-msg">No has seleccionado ningún producto aún.</div> : 
                            carrito.map((prod, i) => (
                                <Elemento 
                                    key={"c-"+i} 
                                    nombre={prod} 
                                    posicion={i} 
                                    alClick={quitarDelCarrito} 
                                    textoBoton="Quitar producto" 
                                />
                            ))
                        }
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
