<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Elemento({ nombre, alClick, posicion, textoBoton }) {
            return (
                <div style={{ border: "1px solid black", margin: "5px", padding: "5px" }}>
                    <span>{nombre}</span>
                    {/* Usamos una función anónima tradicional para "envolver" la ejecución */}
                    <button onClick={function() { alClick(posicion) }}>
                        {textoBoton}
                    </button>
                </div>
            );
        }

        function App() {
            const productosDisponibles = ["Adermicina", "Bengue", "Ibuprofeno", "Buscapina"];
            const [carrito, setCarrito] = useState([]);

            // Función tradicional para agregar
            const agregarAlCarrito = function(nombre) {
                setCarrito([...carrito, nombre]);
            };

            // Función tradicional para quitar
            const quitarDelCarrito = function(indiceABorrar) {
                // El filter también recibe una función anónima con su propio return
                const nuevoCarrito = carrito.filter(function(item, indiceActual) {
                    return indiceActual !== indiceABorrar;
                });
                setCarrito(nuevoCarrito);
            };

            return (
                <div>
                    <h1>Items: {carrito.length}</h1>

                    <h3>Productos para agregar:</h3>
                    {/* El .map ahora usa la sintaxis clásica de función */}
                    {productosDisponibles.map(function(prod, i) {
                        return (
                            <Elemento 
                                key={i} 
                                nombre={prod} 
                                posicion={prod} 
                                alClick={agregarAlCarrito} 
                                textoBoton="Agregar" 
                            />
                        );
                    })}

                    <hr />

                    <h3>Tu Carrito (Borra el exacto):</h3>
                    {carrito.map(function(prod, i) {
                        return (
                            <Elemento 
                                key={i} 
                                nombre={prod} 
                                posicion={i} 
                                alClick={quitarDelCarrito} 
                                textoBoton="Quitar" 
                            />
                        );
                    })}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
