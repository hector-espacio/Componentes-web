<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio React - Funciones Clásicas</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // Extraemos useState de React
        const useState = React.useState;

        // --- COMPONENTE: ProductForm ---
        // Definido con la palabra reservada function
        function ProductForm(props) {
            // Desestructuramos la prop loading según el requerimiento
            const loading = props.loading;
            const onSubmit = props.onSubmit;

            return (
                <form onSubmit={onSubmit}>
                    <h3>Subir Nuevo Producto</h3>
                    <input type="text" placeholder="Nombre del producto" required />
                    <br /><br />
                    
                    {/* El botón se deshabilita si loading es true */}
                    <button type="submit" disabled={loading}>
                        {loading ? "Cargando..." : "Enviar Producto"}
                    </button>
                </form>
            );
        }

        // --- COMPONENTE: NewProductContainer ---
        function NewProductContainer() {
            // 1. Crear el estado loading inicializado en false
            const [loading, setLoading] = useState(false);

            // Función para manejar el envío
            async function handleFormSubmit(e) {
                e.preventDefault();
                
                // 2. Activar el estado de carga
                setLoading(true);

                try {
                    console.log("Iniciando subida...");
                    // Simulación de espera de red (2 segundos)
                    await new Promise(function(resolve) {
                        setTimeout(resolve, 2000);
                    });
                    alert("¡Producto guardado!");
                } catch (error) {
                    console.error("Error:", error);
                    alert("Error al procesar");
                } finally {
                    // 3. Desactivar el estado de carga (siempre ocurre)
                    setLoading(false);
                }
            }

            return (
                <div style={{ padding: '20px', fontFamily: 'sans-serif' }}>
                    <h1>Panel de Administración</h1>
                    <hr />
                    {/* 4. Pasar el estado como prop al componente hijo */}
                    <ProductForm 
                        loading={loading} 
                        onSubmit={handleFormSubmit} 
                    />
                </div>
            );
        }

        // Renderizado de la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NewProductContainer />);
    </script>
</body>
</html>
