<!DOCTYPE html>
<html>
<head>
    <title>Fetch Limpio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

    <h1>Estado:</h1>
    <div id="contenedor">Cargando...</div>

    <script>
        fetch('Ejemplo02-FetchThenVectorial-datos.json')
            .then(respuesta => {
                if (!respuesta.ok) {
                    throw new Error("Servidor prendido sin encontrar archivo");
                }
                return respuesta.json();
            })
            .then(datos => {
                // Suponiendo que 'datos' ahora es un Array de objetos
                let contenido = "";
                
                datos.forEach(item => {
                    contenido += `
                        <div style="margin-bottom: 10px;">
                            Datos: ${item.nombre}<br>
                            Edad: ${item.edad}<br>
                            Pagina: ${item.web}
                        </div><hr>`;
                });

                document.getElementById('contenedor').innerHTML = contenido;
            })
            .catch(error => {
                const caja = document.getElementById('contenedor');

                if (error.message.includes("prendido")) {
                    caja.innerHTML = `<b style="color:orange;">${error.message}</b>`;
                } else {
                    caja.innerHTML = `<b style="color:red;">Servidor apagado</b>`;
                }
            });
    </script>

</body>
</html>
