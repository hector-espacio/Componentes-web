  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <div id="root"></div>


<script type="text/babel">
    const { useState, useEffect } = React;

    const mensajitoError= ["Servidor encendido, pero falta el archivo" , "Servidor apagado o error de red " ];

    function App() {
        const [posts, setPosts] = useState([]);
        const [error, setError] = useState(null);

        useEffect(() => {
            fetch('reactdatos.json')
                .then(res => {
                    if (res.ok) return res.json();
                    // Mensaje descriptivo y claro
                    throw new Error("archivo no encontrado en el servidor");
                })
                .then(data => setPosts(data))
                .catch(err => {
                    
                    if (err.message === "archivo no encontrado en el servidor") {
                        setError(mensajitoError[0]);
                    } else {
                        setError(mensajitoError[1]);
                    }
                });
        }, []);

        // JSX puro y directo
        if (error !== null){
            return (
                <h1>
                    <u>Error: { error  }</u><br />
                    <br />
                    Esto es una super locura
                </h1>
            );
        }

        if (posts.length === 0) return <div>Intentando conectar...</div>;

        return (
            <>
                <h1>Lista de Usuarios</h1>
                <ul>
                    {posts.map(p => <li key={p.id}>{p.nombre}</li>)}
                </ul>
            </>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
