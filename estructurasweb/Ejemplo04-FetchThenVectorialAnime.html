<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Anime</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg-color: #ffffff;
            --border-color: #2d3436;
            --accent-color: #0984e3;
            --text-main: #2d3436;
            --tag-bg: #f1f2f6;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        #contenedor {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover; /* Recorta la imagen para que todas midan lo mismo sin deformarse */
            border-bottom: 2px solid var(--border-color);
            display: block;
        }

        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin: 0;
        }

        .card-genre {
            font-size: 0.8rem;
            color: #fff;
            background-color: var(--border-color);
            padding: 3px 8px;
            width: fit-content;
            text-transform: uppercase;
        }

        .status-msg {
            text-align: center;
            padding: 50px;
            border: 2px dashed var(--border-color);
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <h1>Catálogo Anime</h1>
    <div id="contenedor" class="status-msg">Cargando galería...</div>

    <script>
        fetch('Ejemplo04-ListaAnime.json')
            .then(respuesta => {
                if (!respuesta.ok) {
                    throw new Error("Servidor prendido sin encontrar archivo");
                }
                return respuesta.json();
            })
            .then(datos => {
                let contenido = "";

                datos.forEach(item => {
                    // Se asume que las imágenes están en una carpeta llamada 'img' 
                    // y tienen extensión .jpg (ajusta según tu caso)
                    contenido += `
                        <div class="card">
                            <img src="img/${item.imagen}.jpg" alt="${item.anime}">
                            <div class="card-info">
                                <p class="card-title">${item.anime}</p>
                                <span class="card-genre">${item.genero}</span>
                            </div>
                        </div>`;
                });

                const caja = document.getElementById('contenedor');
                caja.classList.remove('status-msg');
                caja.innerHTML = contenido;
            })
            .catch(error => {
                const caja = document.getElementById('contenedor');
                if (error.message.includes("prendido")) {
                    caja.innerHTML = `<b style="color:orange;">${error.message}</b>`;
                } else {
                    caja.innerHTML = `<b style="color:red;">Servidor apagado</b>`;
                }
            });
    </script>

</body>
</html>
