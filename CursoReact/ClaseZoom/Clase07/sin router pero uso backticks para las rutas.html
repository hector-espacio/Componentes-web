  <a href="#/Animes-favoritos">Lista de animes</a>
</nav>

<div id="contenido"></div>

<script>

const rutas = {
  "#/": `
  
  
  
  
<h1>Bienvenidos a mi web</h1>
<h2>Animes que estoy viendo:</h2>
<ol>
  <li>tensei shitara slime datta ken 4ta temporada</li>
  <li>Tongari Boushi no Atelier</li>
  <li>Tsue to Tsurugi no Wistoria 2da temporada
</ol>  
`,
  "#/Animes-favoritos": `
<h2>Mis animes favoritos:</h2>
<ol>
  <li>death note
  <li>golden time
  <li>nodame cantabile
  <li>toradora
  <li>shigatsu wa kimi no uso
  <li>code geass
  <li>clannad
  <li>Air tv
  <li>rozen mainden
  <li>kuroko no basuke
</ol>
`,
  "404": "<h1>404 - Pagina web no encontrada</h1>"
};

function manejarUrl(){
  let path = window.location.hash;
  if ( path ===""  ) { path = "#/"; }
  
  let html;
  if ( path in rutas ){  html = rutas[path];}
  else { html = rutas["404"];  }
  
  document.getElementById("contenido").innerHTML = html;

}

window.addEventListener("hashchange", manejarUrl);
window.addEventListener("load", manejarUrl);

</script>
