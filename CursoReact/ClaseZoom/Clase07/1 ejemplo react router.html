<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>React Router CDN Simple</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/react-router-dom@5.3.0/umd/react-router-dom.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // En la versión CDN, ReactRouterDOM es el objeto global
        const { HashRouter, Route, Link, Switch } = ReactRouterDOM;

        const Inicio = () => <h1>🏠 Página de Inicio</h1>;
        const Perfil = () => <h1>👤 Perfil del Usuario</h1>;

        function App() {
            return (
                <HashRouter>
                    <nav style={{ padding: '10px', background: '#eee' }}>
                        <Link to="/">Inicio</Link> | <Link to="/perfil">Ir al Perfil</Link>
                    </nav>

                    <div style={{ marginTop: '20px' }}>
                        {/* El Switch ayuda a renderizar solo UN componente a la vez */}
                        <Switch>
                            <Route exact path="/">
                                <Inicio />
                            </Route>
                            <Route path="/perfil">
                                <Perfil />
                            </Route>
                        </Switch>
                    </div>
                </HashRouter>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
